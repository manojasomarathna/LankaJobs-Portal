{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">

    <!-- Job Summary -->
    <div class="card border-0 mb-4" style="background:linear-gradient(135deg,#1e3a8a,#2563eb);border-radius:18px;">
      <div class="card-body p-4 text-white">
        <div class="d-flex align-items-center gap-3">
          <div style="width:52px;height:52px;background:rgba(255,255,255,0.15);border-radius:12px;display:flex;align-items:center;justify-content:center;">
            <i class="bi bi-building fs-4"></i>
          </div>
          <div>
            <h5 class="fw-bold mb-1">{{ job.title }}</h5>
            <p class="mb-0 small" style="color:#bfdbfe;">
              <i class="bi bi-building me-1"></i>{{ job.company }}
              <span class="mx-2">•</span>
              <i class="bi bi-geo-alt me-1"></i>{{ job.location }}
            </p>
          </div>
        </div>
        {% if job.salary %}
        <div class="mt-3 pt-3" style="border-top:1px solid rgba(255,255,255,0.2);">
          <span style="background:rgba(255,255,255,0.15);padding:4px 12px;border-radius:20px;font-size:0.85rem;">
            <i class="bi bi-cash me-1"></i>{{ job.salary }}
          </span>
        </div>
        {% endif %}
      </div>
    </div>

    <!-- Apply Form -->
    <div class="card border-0" style="border-radius:18px;box-shadow:0 8px 40px rgba(0,0,0,0.1);">
      <div class="card-body p-4 p-md-5">
        <h5 class="fw-bold mb-1">Submit Your Application</h5>
        <p class="text-muted small mb-4">Upload your CV to apply for this position</p>

        <form method="POST" enctype="multipart/form-data">
          <div class="mb-4">
            <label class="form-label">Upload CV / Resume</label>
            <div class="border-2 border-dashed rounded-3 p-4 text-center" style="border:2px dashed #e2e8f0; background:#f8fafc; cursor:pointer;"
                 onclick="document.getElementById('cvInput').click()">
              <i class="bi bi-cloud-arrow-up text-primary" style="font-size:2rem;"></i>
              <p class="text-muted small mt-2 mb-1">Click to upload your CV</p>
              <p class="text-muted" style="font-size:0.78rem;">PDF, DOC, DOCX — Max 5MB</p>
            </div>
            <input type="file" name="cv" id="cvInput" class="form-control mt-2" accept=".pdf,.doc,.docx" required
                   onchange="document.getElementById('fileName').textContent = this.files[0]?.name || ''"/>
            <small id="fileName" class="text-success mt-1 d-block fw-500"></small>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="bi bi-send me-2"></i>Submit Application
          </button>
        </form>

        <a href="{{ url_for('jobs') }}" class="btn btn-outline-secondary w-100 mt-3">
          <i class="bi bi-arrow-left me-1"></i>Back to Jobs
        </a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
