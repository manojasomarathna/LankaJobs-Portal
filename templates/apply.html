{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-1">Apply for: {{ job.title }}</h4>
        <p class="text-muted mb-4"><i class="bi bi-building me-1"></i>{{ job.company }} &bull; {{ job.location }}</p>
        <form method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Upload CV (PDF, DOC, DOCX)</label>
            <input type="file" name="cv" class="form-control" accept=".pdf,.doc,.docx" required/>
          </div>
          <button type="submit" class="btn btn-primary w-100">Submit Application</button>
        </form>
        <a href="{{ url_for('jobs') }}" class="btn btn-outline-secondary w-100 mt-2">Back to Jobs</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
