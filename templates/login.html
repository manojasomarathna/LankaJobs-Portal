{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card auth-card border-0">
      <div class="card-body">
        <div class="auth-header">
          <div class="auth-icon"><i class="bi bi-box-arrow-in-right"></i></div>
          <h4 class="fw-bold mb-1">Welcome Back</h4>
          <p class="text-muted small">Sign in to your LankaJobs account</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0" style="border-radius:10px 0 0 10px; border:1.5px solid #e2e8f0;">
                <i class="bi bi-envelope text-muted"></i>
              </span>
              <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="you@example.com"
                     style="border-radius:0 10px 10px 0; border:1.5px solid #e2e8f0;" required/>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0" style="border-radius:10px 0 0 10px; border:1.5px solid #e2e8f0;">
                <i class="bi bi-lock text-muted"></i>
              </span>
              <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="Enter password"
                     style="border-radius:0 10px 10px 0; border:1.5px solid #e2e8f0;" required/>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login
          </button>
        </form>
        <hr class="my-4"/>
        <p class="text-center text-muted small mb-0">
          Don't have an account? <a href="{{ url_for('register') }}" class="fw-600 text-primary">Register here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
