{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-4">{{ 'Edit Job' if job else 'Post a New Job' }}</h4>
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Job Title</label>
              <input type="text" name="title" class="form-control" value="{{ job.title if job else '' }}" required/>
            </div>
            <div class="col-md-6">
              <label class="form-label">Company</label>
              <input type="text" name="company" class="form-control" value="{{ job.company if job else '' }}" required/>
            </div>
            <div class="col-md-6">
              <label class="form-label">Location</label>
              <input type="text" name="location" class="form-control" value="{{ job.location if job else '' }}" required/>
            </div>
            <div class="col-md-6">
              <label class="form-label">Salary</label>
              <input type="text" name="salary" class="form-control" value="{{ job.salary if job else '' }}" placeholder="e.g. LKR 60,000"/>
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea name="description" class="form-control" rows="5" required>{{ job.description if job else '' }}</textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-primary mt-3 w-100">{{ 'Update Job' if job else 'Post Job' }}</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
