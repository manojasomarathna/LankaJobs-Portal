{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card auth-card border-0">
      <div class="card-body">
        <div class="auth-header">
          <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
          <h4 class="fw-bold mb-1">Create Account</h4>
          <p class="text-muted small">Join LankaJobs and find your dream job</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0" style="border-radius:10px 0 0 10px; border:1.5px solid #e2e8f0;">
                <i class="bi bi-person text-muted"></i>
              </span>
              <input type="text" name="name" class="form-control border-start-0 ps-0" placeholder="Your full name"
                     style="border-radius:0 10px 10px 0; border:1.5px solid #e2e8f0;" required/>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0" style="border-radius:10px 0 0 10px; border:1.5px solid #e2e8f0;">
                <i class="bi bi-envelope text-muted"></i>
              </span>
              <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="you@example.com"
                     style="border-radius:0 10px 10px 0; border:1.5px solid #e2e8f0;" required/>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0" style="border-radius:10px 0 0 10px; border:1.5px solid #e2e8f0;">
                <i class="bi bi-lock text-muted"></i>
              </span>
              <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="Create a password"
                     style="border-radius:0 10px 10px 0; border:1.5px solid #e2e8f0;" required/>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">I am a...</label>
            <div class="row g-2">
              <div class="col-6">
                <input type="radio" class="btn-check" name="role" id="jobseeker" value="jobseeker" checked/>
                <label class="btn btn-outline-primary w-100 py-3" for="jobseeker">
                  <i class="bi bi-person-workspace d-block fs-4 mb-1"></i>
                  <span class="small fw-500">Job Seeker</span>
                </label>
              </div>
              <div class="col-6">
                <input type="radio" class="btn-check" name="role" id="employer" value="employer"/>
                <label class="btn btn-outline-primary w-100 py-3" for="employer">
                  <i class="bi bi-building d-block fs-4 mb-1"></i>
                  <span class="small fw-500">Employer</span>
                </label>
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="bi bi-person-check me-2"></i>Create Account
          </button>
        </form>
        <hr class="my-4"/>
        <p class="text-center text-muted small mb-0">
          Already have an account? <a href="{{ url_for('login') }}" class="fw-600 text-primary">Login here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
